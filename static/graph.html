<div class="graph-page">

  <div class="graph-layout">
    <aside class="control-panel">
      <section class="panel" id="graphA-panel">
        <h2>Grafo A</h2>
        <label>Id del grafo</label>
        <input id="graphA-id" list="graph-id-list" type="text" placeholder="grafoA" autocomplete="off" />
        <div class="toggle-row">
          <label><input id="graphA-directed" type="checkbox" /> Dirigido</label>
          <label><input id="graphA-weighted" type="checkbox" /> Ponderado</label>
        </div>
        <label>Vértices (uno por línea o separados por comas)</label>
        <textarea id="graphA-vertices" placeholder="A, B, C"></textarea>
        <label>Aristas (línea = nombre,origen,destino[,peso])</label>
        <textarea id="graphA-edges" placeholder="e1,A,B,1"></textarea>
        <div class="button-row">
          <button id="create-graphA" class="primary">Crear Grafo A</button>
          <button id="clear-graphA">Limpiar</button>
        </div>

        <div class="delete-block">
          <label>Eliminar vértice</label>
          <div class="delete-row">
            <select id="graphA-delete-vertex-select"></select>
            <button id="delete-vertex-A" class="danger">Borrar</button>
          </div>
          <input id="graphA-delete-vertex-text" type="text" placeholder="o escribe nombre del vértice" />

          <label>Eliminar arista</label>
          <div class="delete-row">
            <select id="graphA-delete-edge-select"></select>
            <button id="delete-edge-A" class="danger">Borrar</button>
          </div>
          <input id="graphA-delete-edge-text" type="text" placeholder="o escribe nombre de la arista" />
        </div>
      </section>

      <section class="panel" id="graphB-panel">
        <h2>Grafo B</h2>
        <label>Id del grafo</label>
        <input id="graphB-id" list="graph-id-list" type="text" placeholder="grafoB" autocomplete="off" />
        <div class="toggle-row">
          <label><input id="graphB-directed" type="checkbox" /> Dirigido</label>
          <label><input id="graphB-weighted" type="checkbox" /> Ponderado</label>
        </div>
        <label>Vértices (uno por línea o separados por comas)</label>
        <textarea id="graphB-vertices" placeholder="1, 2, 3"></textarea>
        <label>Aristas (línea = nombre,origen,destino[,peso])</label>
        <textarea id="graphB-edges" placeholder="f1,1,2"></textarea>
        <div class="button-row">
          <button id="create-graphB" class="primary">Crear Grafo B</button>
          <button id="clear-graphB">Limpiar</button>
        </div>

        <div class="delete-block">
          <label>Eliminar vértice</label>
          <div class="delete-row">
            <select id="graphB-delete-vertex-select"></select>
            <button id="delete-vertex-B" class="danger">Borrar</button>
          </div>
          <input id="graphB-delete-vertex-text" type="text" placeholder="o escribe nombre del vértice" />

          <label>Eliminar arista</label>
          <div class="delete-row">
            <select id="graphB-delete-edge-select"></select>
            <button id="delete-edge-B" class="danger">Borrar</button>
          </div>
          <input id="graphB-delete-edge-text" type="text" placeholder="o escribe nombre de la arista" />
        </div>
      </section>

      <section class="panel">
        <h2>Operación</h2>
        <label>Tipo de operación</label>
        <select id="operation-select">
          <option value="union">Unión</option>
          <option value="intersection">Intersección</option>
          <option value="ring-sum">Suma simétrica</option>
          <option value="sum">Suma de grafos</option>
          <option value="complement">Complemento</option>
          <option value="cartesian-product">Producto cartesiano</option>
          <option value="tensor-product">Producto tensor</option>
          <option value="composition">Composición</option>
        </select>

        <div class="toggle-row label-options">
          <label><input id="edge-label-name-toggle" type="checkbox" /> Mostrar nombres de aristas</label>
          <label><input id="edge-label-weight-toggle" type="checkbox" /> Mostrar pesos</label>
        </div>

        <label id="execute-label">Grafo A</label>
        <select id="graphA-select"></select>
        <div id="graphB-selector-row">
          <label>Grafo B</label>
          <select id="graphB-select"></select>
        </div>

        <label>Id de resultado</label>
        <input id="graph-result-id" type="text" placeholder="resultado" />
        <div class="button-row">
          <button id="execute-operation" class="primary">Ejecutar operación</button>
          <button id="reset-all" class="danger">Reiniciar vista</button>
        </div>

        <p id="unary-note" class="unary-note">El complemento sólo usa Grafo A. Grafo B se mantiene inactivo.</p>
      </section>
      <datalist id="graph-id-list"></datalist>
    </aside>

    <main class="visual-panel">
      <div class="graph-cards" id="graph-cards">
        <button id="graph-layout-toggle" class="graph-control graph-layout-control" type="button" title="Alternar disposición">↕</button>
        <article class="graph-card">
          <header>
            <h3>Grafo A</h3>
            <span id="graphA-summary" class="graph-summary"></span>
          </header>
          <div class="graph-viewport" id="graphA-container"></div>
        </article>

        <article class="graph-card" id="graphB-card">
          <header>
            <h3>Grafo B</h3>
            <span id="graphB-summary" class="graph-summary"></span>
          </header>
          <div class="graph-viewport" id="graphB-container"></div>
        </article>

        <article class="graph-card result-card">
          <header>
            <h3>Resultado</h3>
            <span id="graphResult-summary" class="graph-summary"></span>
          </header>
          <div class="graph-viewport" id="graphResult-container"></div>
        </article>
      </div>

      <section class="panel graph-log-panel">
        <h2>Estado y detalles</h2>
        <div id="graph-info" class="graph-info"></div>
        <div id="graph-log" class="graph-log"></div>
      </section>
    </main>
  </div>
</div>
