<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="static/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="static/css/global-reset.css" />

  <link rel="stylesheet" href="static/css/components.css" />
  <link rel="stylesheet" href="static/css/layout.css" />
  <link rel="stylesheet" href="static/css/visualization.css" />

  <link rel="stylesheet" href="static/css/notificaciones.css" />

  <title>Simuladores - Ciencias de la Computación II</title>

<body>
  <!-- Title bar -->
  <div class="title">Ciencias de la Computación II</div>

  <!-- Tabs -->
  <div class="tab-bar">
    <div class="tab active" data-type="inicio" onclick="handleTabClick('inicio')">Inicio</div>
    <div class="tab" data-type="busquedas" onclick="handleTabClick('busquedas')">Búsquedas</div>
    <div class="tab" data-type="grafos" onclick="handleTabClick('grafos')">Grafos</div>
  </div>

  <!-- Ribbon -->
  <div class="ribbon" id="ribbon">

  <div class="ribbon-row">
    <div id="ribbon-level-1"></div>
  </div>

  <div class="ribbon-row">
    <div id="ribbon-level-2"></div>
  </div>

  <div class="ribbon-row">
    <div id="ribbon-level-3"></div>
  </div>
</div>

  <!-- Main content -->
  <main id="content">
    <section class="landing-hero">
      <div class="hero-copy">

        <div class="hero-actions">
          <button id="start-btn" class="primary">Comenzar</button>
        </div>
    </section>
  </main>

<div class="app-footer">
  <div class="footer-btns">
    <button id="save-btn">Guardar</button>
    <button id="open-btn">Abrir</button>
    <button id="print-btn">Imprimir</button>
  </div>
</div>
